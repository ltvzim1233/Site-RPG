<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor Ficha RPG</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="icon.png" type="image/x-icon">
</head>
<body>
    <div class="main">
        <div class="conteiner info-basicas">
            <div>
                <p>Nome do Jogador</p>
                <input type="text" name="" id="" placeholder="Lucas">
            </div>

            <div>
                <p>Nome do Personagem</p>
                <input type="text" name="" id="" placeholder="Ex:MagoBolado">
            </div>

            <div>
                <p>Classe</p>
                <select name="" id="">
                    <option value="None" disabled selected>Classe</option>
                    <option value="Cavalheiro">Cavalheiro</option>
                    <option value="Mago">Mago</option>
                    <option value="Arqueiro">Arqueiro</option>
                    <option value="Paladino">Paladino</option>
                    <option value="Guerreiro">Guerreiro</option>
                    <option value="Espadachim">Espadachim</option>
                    <option value="Ferreiro">Ferreiro</option>
                    <option value="Monge">Monge</option>
                    <option value="Piromaniaco">Piromaniaco</option>
                    <option value="Feiticeiro">Feiticeiro</option>
                    <option value="Tank">Tank</option>
                </select>
            </div>
        </div>

        <div class="conteiner info-status">
            <div>
                <p>HP</p>
                <input type="number" name="" id="" max="1000" min="1" placeholder="10">
            </div>

            <div>
                <p>Defesa</p>
                <input type="number" name="" id="" max="100" min="1">
            </div>

            <div>
                <p>Mana</p>
                <input type="number" name="" id="" max="100" min="1">
            </div>

            <div>
                <p>Velocidade</p>
                <input type="number" name="" id="" max="100" min="1">
            </div>

            <div>
                <p>Raças</p>
                <select name="" id="">
                    <option value="none" disabled selected>Raça</option>
                    <option value="Humano">Humano</option>
                    <option value="Goblin">Goblin</option>
                    <option value="Gigante">Gigante</option>
                    <option value="Elfo">Elfo</option>
                    <option value="Fada">Fada</option>
                    <option value="Slime">Slime</option>
                    <option value="Draconico">Draconico</option>
                    <option value="Homem-Peixe">Homem-Peixe</option>
                    <option value="Homem-Fera">Homem-Fera</option>
                </select>
            </div>
        </div>

        <div class="conteiner info-gerais">
            <div class="wrapper">
                <div>
                    <p>
                        Bibliografia:
                    </p>
                    <textarea name="" id="" rows=" 30" cols="40"></textarea>
                </div>
                <div>
                    <p>
                        Imagem Do Player:
                    </p>
                    <input type="file" name="" id="">
                </div>
                <div>
                    <p>
                        Equipamentos:
                    </p>
                    <textarea name="" id="" rows="30" cols="40"></textarea>
                </div>
            </div>
            
            <div>
                <p>
                    Inventario
                </p>
                <textarea name="" id="" rows="10" cols="110"></textarea>
            </div>
        </div>
    </div>
</body>
</html>
